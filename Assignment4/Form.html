<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <title>Feedback</title>
  <style>
    label {	float: left;
			width: 150px;}
      #container{
          width: 700px;
          margin: auto;
          background-color: beige;
      } 
      main{
          padding: 50px;
      }
	#ai-assistant-btn{
	  position: absolute; right: 16px; top: 16px;
	  padding: 6px 10px; border: 1px solid #333; background:#fff; cursor:pointer;
	}
	#ai-chat{
	  position: fixed; right: 16px; bottom: 16px; width: 300px;
	  background:#fff; border:1px solid #ccc; border-radius:8px;
	  box-shadow: 0 8px 24px rgba(0,0,0,.15); display:flex; flex-direction:column;
	  max-height: 60vh; z-index: 9999;
	}
	#ai-chat[hidden] { display: none !important; }
	.ai-chat-header{
	  display:flex; justify-content:space-between; align-items:center;
	  padding:8px 10px; border-bottom:1px solid #eee; background:#f9fafb;
	}
	#ai-chat-messages{
	  padding:10px; overflow:auto; flex:1; font-size:.95rem;
	}
	.ai-chat-inputrow{ display:flex; gap:6px; padding:8px; border-top:1px solid #eee; }
	.ai-bubble{ margin:6px 0; padding:8px 10px; border-radius:10px; line-height:1.4; }
	.ai-user{ background:#e6f0ff; align-self:flex-end; }
	.ai-bot{ background:#f1f5f9; }
  </style>
 </head>
 <body>
<button id="ai-assistant-btn" type="button" title="Need help?">AI Assistant</button>

<div id="ai-chat" hidden>
  <div class="ai-chat-header">
    <strong>AI Assistant</strong>
    <button id="ai-chat-close" type="button" aria-label="Close">✕</button>
  </div>
  <div id="ai-chat-messages" aria-live="polite"></div>
  <div class="ai-chat-inputrow">
    <input id="ai-chat-input" type="text" placeholder="Ask a question..." />
    <button id="ai-chat-send" type="button">Send</button>
  </div>
</div>

 <div id="container">
	 <main>
	 <h2>Feeback</h2>
	 <h3>Love something? Hate something? Let us know!</h3>
		 Note : Fields marked with an asterisk(*) are mandatory
		 <br><br>
		 <form method="post" novalidate>
			<label>Title*:</label>
			<input type="radio" name="title" id="miss" value="Miss" required="required"/>Miss
			<input type="radio" name="title" id="mr" value="Mr" required="required"/>Mr.
			<input type="radio" name="title" id="mrs" value="Mrs" required="required"/>Mrs.
			<br><br>
			<label for="firstName">First Name*:</label>
			<input type="text" name="firstName" id="firstName" placeholder="First Name" />	
			<br><br>
			

			<label for="lastName">Last Name*:</label>
			<input type="text" name="lastName" id="lastName" placeholder="Last Name" />
			<br><br>
			

			<label for="emailId">Email Id*:</label>
			<input type="text" name="emailId" id="emailId" placeholder="yourname@domain.com" />
			<br><br>
			

			<label for="phoneNumber">Phone Number*:</label>
			<input type="text" name="phoneNumber" id="phoneNumber" placeholder="xxx-xxx-xxxx" />
			<br><br>
			
            <label for="zipcode">ZipCode*:</label>
			<input type="text" name="zipcode" id="zipcode" placeholder="xxxxxx" />
			<br><br>

			<label for="address">Address:</label>
			<input type="text" name="address" id="address" placeholder="Street, City, State" maxlength="20" />
			<br><br>
             
            <label for="zipcode">How did you hear*:</label>
			<input type='checkbox' name="source" value="facebook" /> Facebook
            <input type='checkbox' name="source" value="google" /> Google
            <input type='checkbox' name="source" value="yelp" /> Yelp 
			<br><br>
			
			<label for="topic">Topic:</label>
			<select id="topic" name="topic">
			  <option value="" selected disabled>-- Select a topic --</option>
			  <option value="delivery">Delivery</option>
			  <option value="support">Support</option>
			  <option value="billing">Billing</option>
			  <option value="products">Products</option>
			  <option value="other">Other</option>
			</select>
			<br><br>

			<div id="dynamic-area"></div>
			<br>
             
			<label for="comments">Comments*:</label>
			<textarea name="text" id="comments" placeholder="Your comments" rows="5" cols="25"></textarea>
			<br><br>
			<input type="Submit">
			<input type="Reset">
			<br><br>

			<div id="submission-preview"></div>
		 </form>
	 </main>
 </div>

 <script src="script.js"></script>

 </body>
</html>
