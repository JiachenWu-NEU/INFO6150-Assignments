<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assignment 3 – Dynamic Student Table</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="page-header">
    <h1 id="student-id">Jiachen Wu —002319061</h1>
  </header>

  <main class="container">
    <section class="controls">
      <button id="addBtn" class="btn">Add New Student</button>
      <button id="submitBtn" class="btn btn-submit" disabled>Submit</button>
      <span class="hint">Tip: Select any row checkbox to enable Submit.</span>
    </section>

    <section class="table-wrap" aria-label="Students">
      <table id="studentsTable" class="students">
        <caption>Students Roster</caption>
        <thead>
          <tr>
            <th scope="col" class="col-expand" title="Expand/Collapse"></th>
            <th scope="col">Select</th>
            <th scope="col">Student</th>
            <th scope="col">Teacher</th>
            <th scope="col">Assignment</th>
            <th scope="col">Score</th>
            <th scope="col">EDIT</th>
            <th scope="col">DELETE</th>
          </tr>
        </thead>
        <tbody id="tableBody">

        </tbody>
        <tfoot>
          <tr>
            <td colspan="8" id="summaryCell">0 record(s)</td>
          </tr>
        </tfoot>
      </table>
    </section>
  </main>

  <dialog id="editDialog">
    <form method="dialog" id="editForm" class="edit-form">
      <h3 id="editTitle">Edit details</h3>
      <label>
        New value
        <input type="text" id="editInput" placeholder="Type something…" />
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-ghost">Cancel</button>
        <button id="editOkBtn" class="btn">OK</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
